name: Card Email Auto Import

on:
  # 定期実行を停止中（もう使わないため）。再開する場合はscheduleのコメントを外す。
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  call-import-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Call email import endpoint
        env:
          EMAIL_IMPORT_URL: ${{ secrets.EMAIL_IMPORT_URL }}
          EMAIL_IMPORT_SECRET: ${{ secrets.EMAIL_IMPORT_SECRET }}
        run: |
          curl --fail -X POST "$EMAIL_IMPORT_URL" \
            -H "Authorization: Bearer $EMAIL_IMPORT_SECRET"
